<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketing, Comportamiento del Consumidor e Investigación - Bibliografía</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent-base: #054C50; 
            --accent-bright: #4ce6ef; 
            --glass-bg: rgba(255, 255, 255, 0.02);
            --glass-border: rgba(5, 76, 80, 0.4);
            --text-main: #ffffff;
            --text-dim: #d0f0f2;
        }

        body {
            margin: 0; padding: 0; min-height: 100vh;
            font-family: 'Inter', sans-serif;
            background-color: #021a1b;
            color: var(--text-main);
            display: flex; flex-direction: column; align-items: center;
            overflow-x: hidden; cursor: default;
        }

        .fluid-background {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; overflow: hidden; background: #011112; filter: blur(80px);
        }
        .fluid-layer { position: absolute; border-radius: 50%; opacity: 0.35; animation: fluidMove infinite alternate ease-in-out; }
        .layer-1 { background: radial-gradient(circle, var(--accent-base) 0%, transparent 70%); width: 100vw; height: 100vw; top: -30%; left: -10%; animation-duration: 20s; }
        .layer-2 { background: radial-gradient(circle, #083335 0%, transparent 70%); width: 80vw; height: 80vw; bottom: -20%; right: -10%; animation-duration: 25s; }
        @keyframes fluidMove { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(10%, 5%) scale(1.1); } }

        .nav-instruction {
            width: 90vw; max-width: 1400px;
            background: rgba(5, 76, 80, 0.15);
            border: 1px dashed var(--accent-bright);
            padding: 15px; border-radius: 12px;
            margin-top: 30px;
            text-align: center;
            font-size: 0.9rem; color: var(--accent-bright);
            backdrop-filter: blur(10px);
            z-index: 10;
        }

        .main-header { text-align: center; padding: 30px 20px; z-index: 1; }
        .main-header h1 { font-weight: 300; font-size: 2rem; letter-spacing: 4px; text-transform: uppercase; margin: 0; background: linear-gradient(to right, #fff, var(--text-dim)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .main-header .line { width: 60px; height: 3px; background: var(--accent-bright); margin: 15px auto; }

        .reference-grid {
            display: grid; width: 90vw; max-width: 1400px;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px; padding-bottom: 80px; z-index: 1;
        }

        .card {
            font-family: 'Poppins', sans-serif;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px; padding: 25px;
            display: flex; flex-direction: column;
            transition: all 0.3s ease;
            min-height: 160px;
        }
        .card:hover { border-color: var(--accent-bright); transform: translateY(-5px); background: rgba(5, 76, 80, 0.12); box-shadow: 0 10px 20px rgba(5, 76, 80, 0.25); }

        .author-tag { font-size: 0.75rem; font-weight: 600; color: var(--accent-bright); text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 12px; }
        .title { font-size: 0.9rem; font-weight: 400; line-height: 1.6; color: var(--text-main); margin-bottom: 15px; }

        .footer-info {
            font-size: 0.75rem; font-weight: 300; color: var(--text-dim);
            border-top: 1px solid rgba(5, 76, 80, 0.3);
            padding-top: 15px; margin-top: auto; word-break: break-all;
        }

        .link-text {
            color: var(--accent-bright);
            text-decoration: underline;
            transition: color 0.2s;
        }
        .link-text:hover {
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="fluid-background">
        <div class="fluid-layer layer-1"></div>
        <div class="fluid-layer layer-2"></div>
    </div>

    <div class="nav-instruction">
        🎯 <b>Instrucción de Navegación:</b> Consulta las referencias clave sobre marketing estratégico, comportamiento del consumidor, investigación de mercados y segmentación psicográfica.
    </div>

    <header class="main-header">
        <h1>Marketing, Comportamiento del Consumidor e Investigación</h1>
        <div class="line"></div>
    </header>

    <main class="reference-grid" id="grid"></main>

    <script>
        const sources = [
            { a: "Armstrong, G., Kotler, P., Harker, M., & Brennan, R. (2023)", t: "Marketing: An Introduction", f: "Pearson" },
            { a: "Churchill, G. A., & Iacobucci, D. (2022)", t: "Marketing Research: Methodological Foundations", f: "Cengage Learning" },
            { a: "Hair, J. F., Bush, R. P., & Ortinau, D. J. (2023)", t: "Marketing Research", f: "McGraw Hill" },
            { a: "Kotler, P., Keller, K. L., & Chernev, A. (2022)", t: "Marketing Management", f: "Pearson" },
            { a: "Levy, D. (2021)", t: "Construction Marketing: Strategies for Success", f: "Routledge" },
            { a: "Malhotra, N. K. (2020)", t: "Investigación de mercados", f: "Pearson" },
            { a: "Porter, M. E. (2008)", t: "The Five Competitive Forces That Shape Strategy", f: "Harvard Business Review" },
            { a: "Ries, A., & Trout, J. (2001)", t: "Positioning: The Battle for Your Mind", f: "McGraw-Hill" },
            { a: "Roger, J. (2013)", t: "Market-Based Management: Strategies for Growing Customer Value and Profitability (6th ed.)", f: "Pearson Education, Inc." },
            { a: "Schiffman, L., Wisenblit, J., & Kumar, S. (2023)", t: "Consumer Behavior (13th ed.)", f: "Pearson Education" },
            { a: "Solomon, M. (2008)", t: "Comportamiento del consumidor (7th ed.)", f: "Pearson Education" },
            { a: "SRI (1978)", t: "VALS™: The VALS Types", f: "Strategic Business Insights International", u: "https://www.sri.com/hoi/vals-market-research/" },
            { a: "Zikmund, W. G. et al. (2021)", t: "Business Research Methods", f: "Cengage Learning" }
        ];

        const grid = document.getElementById('grid');

        sources.forEach((s) => {
            const card = document.createElement('div');
            card.className = 'card';
            
            let footerContent = s.f;
            if (s.u) {
                footerContent += ` — <a href="${s.u}" target="_blank" class="link-text">${s.u}</a>`;
            }

            let html = `
                <div class="author-tag">${s.a}</div>
                <div class="title">${s.t}</div>
                <div class="footer-info">${footerContent}</div>
            `;

            card.innerHTML = html;
            grid.appendChild(card);
        });
    </script>
</body>
</html>
